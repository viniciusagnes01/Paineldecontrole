  <script>
    (function () {
      var params = new URLSearchParams(window.location.search || '');
      window.V4_BOOT_DEBUG = [];
      window.V4_SAFE_MODE = params.get('safe') === '1';
      window.V4_SHOW_BOOT_DEBUG = params.get('bootdebug') === '1';
      function bootLog(type, message) {
        var item = { at: new Date().toLocaleString('pt-BR'), type: type, message: message };
        window.V4_BOOT_DEBUG.unshift(item);
        try {
          var stored = JSON.parse(localStorage.getItem('v4-boot-debug-log') || '[]');
          stored.unshift(item);
          localStorage.setItem('v4-boot-debug-log', JSON.stringify(stored.slice(0, 40)));
        } catch (error) {}
        var list = document.querySelector('[data-v4-boot-debug-list]');
        if (list) list.innerHTML = window.V4_BOOT_DEBUG.slice(0, 10).map(function (entry) {
          return '<div><strong>' + entry.at + '</strong> [' + entry.type + '] ' + entry.message + '</div>';
        }).join('');
      }
      window.V4_BOOT_LOG = bootLog;
      if (params.get('reset') === '1') {
        try { localStorage.clear(); sessionStorage.clear(); bootLog('reset', 'Cache local limpo antes do app carregar.'); } catch (error) { bootLog('reset_error', error.message); }
      }
      window.addEventListener('error', function (event) { bootLog('window_error', event.message || 'Erro JS sem mensagem'); });
      window.addEventListener('unhandledrejection', function (event) { bootLog('promise_error', event.reason && event.reason.message ? event.reason.message : String(event.reason)); });
      bootLog('boot', 'Bootloader carregado. Asset 20260530-01.');
    })();
  </script>

    <div style="display:flex;gap:8px;align-items:center;justify-content:space-between;">

      <button type="button" onclick="location.href=location.origin+location.pathname+'?reset=1&safe=1&bootdebug=1'" style="border:0;border-radius:999px;padding:6px 10px;background:#444;color:white;font-weight:900;cursor:pointer;">Reset seguro</button>
