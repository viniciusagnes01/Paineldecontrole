  <script>
    (function () {
      var CLEANUP_VERSION = 'prod-clean-20260601-rbac-01';
      window.V4_BOOT_DEBUG = [];
      window.V4_SAFE_MODE = false;
      function bootLog(type, message) {
        window.V4_BOOT_DEBUG.unshift({ at: new Date().toLocaleString('pt-BR'), type: type, message: message });
      }
      function cleanLegacyCache() {
        try {
          if (localStorage.getItem('v4-cleanup-version') === CLEANUP_VERSION) return;
          [
            'v4-growthpack-debug-log',
            'v4-boot-debug-log',
            'v4-sidebar-clients-open',
            'v4-sidebar-squads-open'
          ].forEach(function (key) {
            localStorage.removeItem(key);
            sessionStorage.removeItem(key);
          });
          localStorage.setItem('v4-cleanup-version', CLEANUP_VERSION);
          bootLog('cache_cleanup', 'Cache legado limpo sem apagar estado principal.');
        } catch (error) {
          bootLog('cache_cleanup_error', error.message || String(error));
        }
      }
      window.V4_BOOT_LOG = bootLog;
      cleanLegacyCache();
      window.addEventListener('error', function (event) { bootLog('window_error', event.message || 'Erro JS sem mensagem'); });
      window.addEventListener('unhandledrejection', function (event) { bootLog('promise_error', event.reason && event.reason.message ? event.reason.message : String(event.reason)); });
      bootLog('boot', 'Bootloader limpo carregado.');
    })();
  </script>
